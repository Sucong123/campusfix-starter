name: build-push

on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # GHCR 要求镜像仓库名全小写；GitHub 用户名是 Sucong123，
          # 这里必须写成小写 sucong123，否则会报 invalid reference format。
          tags: ghcr.io/sucong123/campusfix:${{ github.sha }}
